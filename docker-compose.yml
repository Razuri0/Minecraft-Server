services:

  mc-router:
      image: itzg/mc-router:latest
      container_name: mc-router
      restart: unless-stopped
      ports:
        - "25565:25565"
      environment:
        mc-router.auto-scale-wait-timeout: "5m"
        IN_DOCKER: true
        AUTO_SCALE_DOWN: true
        AUTO_SCALE_UP: true
        AUTO_SCALE_DOWN_AFTER: 1h
        AUTO_SCALE_ASLEEP_MOTD: "Server is asleep. Join again to wake it up!"

      networks:
        - minecraft-network

# Minecraft Server
# Using Java 25 for newer JVM arguments
  server:
    image: itzg/minecraft-server:java25-graalvm
    container_name: minecraftServer
    labels:
      mc-router.host: ${MC_DOMAIN}
    stdin_open: true
    tty: true
    restart: unless-stopped
    # Runs as your host user instead of root; the image detects this and skips
    # its own privilege-drop. ./serverdata must be writable by this user
    # (make setup creates it with the right owner).
    user: "${PUID:-1000}:${PGID:-1000}"
    # Pin the server to the CPUs of one NUMA node (set MC_CPUSET in .env).
    # Memory follows automatically: Linux allocates on the node a thread runs on,
    # and -XX:+AlwaysPreTouch touches the whole heap at startup from those CPUs.
    # Leave MC_CPUSET empty to use all CPUs.
    cpuset: "${MC_CPUSET:-}"
    stop_grace_period: 2m
    environment:
      EULA: "TRUE"
      VERSION: "${MC_VERSION}"
      TYPE: "${MC_TYPE}" # VANILLA, FABRIC, NEOFORGE, or FORGE
      # Loader version for the selected TYPE - only the variable matching TYPE
      # is read by the image, the others are ignored.
      # Empty = latest (Fabric/NeoForge) or recommended (Forge).
      FABRIC_LOADER_VERSION: "${MOD_LOADER_VERSION:-}"
      NEOFORGE_VERSION: "${MOD_LOADER_VERSION:-}"
      FORGE_VERSION: "${MOD_LOADER_VERSION:-}"
      MEMORY: "${MC_MEMORY}"
      JVM_OPTS: >
        -XX:+UseZGC
        -XX:+AlwaysPreTouch
        -XX:+UseTransparentHugePages
        --add-modules=jdk.incubator.vector
        -XX:+UseStringDeduplication
        -XX:+UseCompactObjectHeaders
        -Dchunky.maxWorkingCount=2048
    volumes:
      - ./serverdata:/data
    networks:
      - minecraft-network

# Miniserve: A simple file server for sharing files over HTTP.
# for sharing modpacks, configs, and other files related to the Minecraft server.
  miniserve:
    image: svenstaro/miniserve:latest
    container_name: miniserve
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./data:/data
    command: -v --enable-tar --enable-zip /data
    networks:
      - file-network

# Anubis
# Reverse proxy and bot mitigation tool to protect the Miniserve file server from malicious bots and crawlers.
  anubis:
    image: ghcr.io/techarohq/anubis:latest
    container_name: anubis
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - BIND=:8923
      - TARGET=http://miniserve:8080
      - POLICY_FNAME=/data/cfg/botPolicy.yaml
    volumes:
      # persists the challenge database (bbolt) across restarts;
      # bind mount (not named volume) so it's owned by your host user
      - ./anubis-data:/data
      - ./botPolicy.yaml:/data/cfg/botPolicy.yaml:ro
    networks:
      - file-network
    depends_on:
      - miniserve

# Nginx Proxy Manager
# for managing reverse proxies, SSL certificates, and access control for Miniserve.
# s6-based image: must start as root to bind ports 80/443 and set up its
# services, then drops the app processes to PUID/PGID itself.
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt
    networks:
      - file-network

# DDNS Client for DuckDNS
# keeps your dynamic IP address updated with DuckDNS Domain
# using DuckDNS because you get 5 free domains and easy to set up
# (left on :latest on purpose - linuxserver.io only publishes hash-based tags)
# s6-based image like npm: starts as root, drops to PUID/PGID itself.
  ddns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: ddns
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - SUBDOMAINS=${DUCKDNS_SUBDOMAINS}
      - TOKEN=${DUCKDNS_TOKEN}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}

networks:
  minecraft-network:
    external: false
  file-network:
    external: false
