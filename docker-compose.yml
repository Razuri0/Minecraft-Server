services:

  mc-router:
      image: itzg/mc-router:latest
      container_name: mc-router
      restart: unless-stopped
      ports:
        - "25565:25565"
      environment:
        auto-scale-webhook-timeout: "5m"
        auto-scale-webhook-wake-timeout: "5m"
        IN_DOCKER: true
        AUTO_SCALE_DOWN: true
        AUTO_SCALE_UP: true
        AUTO_SCALE_DOWN_AFTER: 1h
        AUTO_SCALE_ASLEEP_MOTD: "Server is asleep. Join again to wake it up!"
      depends_on:
        server:
          condition: service_healthy
      networks:
        - minecraft-network

  # Minecraft Server
  # Using Java 25 for newer JVM arguments
  server:
    # GraalVM Container doesn't work with Forge, so use the regular Java 25 image for Forge servers.
    image: itzg/minecraft-server:java25-graalvm
    container_name: minecraftServer
    labels:
      mc-router.host: ${MC_DOMAIN}^
    stdin_open: true
    tty: true
    restart: unless-stopped
    # Runs as your host user instead of root; the image detects this and skips
    # its own privilege-drop. ./serverdata must be writable by this user
    # (make setup creates it with the right owner).
    user: "${PUID:-1000}:${PGID:-1000}"
    # Pin the server to the CPUs of one NUMA node (set MC_CPUSET in .env).
    # Memory follows automatically: Linux allocates on the node a thread runs on,
    # and -XX:+AlwaysPreTouch touches the whole heap at startup from those CPUs.
    # Leave MC_CPUSET empty to use all CPUs.
    cpuset: "${MC_CPUSET:-}"
    # URL to the packwiz pack used by this server
    PACKWIZ_URL: "${PACKWIZ_URL}"
    stop_grace_period: 2m
    environment:
      EULA: "TRUE"
      VERSION: "${MC_VERSION}"
      TYPE: "${MC_TYPE}" # VANILLA, FABRIC, NEOFORGE, or FORGE
      # Loader version for the selected TYPE - only the variable matching TYPE
      # is read by the image, the others are ignored.
      # Empty = latest (Fabric/NeoForge) or recommended (Forge).
      FABRIC_LOADER_VERSION: "${MOD_LOADER_VERSION:-}"
      NEOFORGE_VERSION: "${MOD_LOADER_VERSION:-}"
      FORGE_VERSION: "${MOD_LOADER_VERSION:-}"
      # Container memory limit
      MEMORY: "${MC_MEMORY}"
      # Server.properties variables (see .env.example for all options)
      VIEW_DISTANCE: "${VIEW_DISTANCE:-}"
      SIMULATION_DISTANCE: "${SIMULATION_DISTANCE:-}"
      ALLOW_FLIGHT: "${ALLOW_FLIGHT:-}"
      HARDCORE: "${HARDCORE:-}"
      MAX_TICK_TIME: "${MAX_TICK_TIME:-}"
      MOTD: "${MOTD:-}"
      DIFFICULTY: "${DIFFICULTY:-}"
      GAMEMODE: "${GAMEMODE:-}"
      MAX_PLAYERS: "${MAX_PLAYERS:-}"
      # JVM options
      JVM_OPTS: >
        -XX:+UseZGC
        -XX:+AlwaysPreTouch
        -XX:+UseTransparentHugePages
        --add-modules=jdk.incubator.vector
        -XX:+UseStringDeduplication
        -XX:+UseCompactObjectHeaders
        -Dchunky.maxWorkingCount=2048
        -XX:ZAllocationSpikeTolerance=2.5
        -Djdk.graal.CompilerConfiguration=enterprise
        -Djdk.graal.TuneInlinerExploration=1.0
    volumes:
      - ./serverdata:/data
    networks:
      - minecraft-network
      - file-network

  # Miniserve: lightweight HTTP file server for packwiz and other files.
  miniserve:
    image: svenstaro/miniserve:latest
    container_name: miniserve
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./data:/data
    command: -v --enable-tar --enable-zip /data
    networks:
      - file-network

  # Nginx Proxy Manager
  # Handles HTTPS/SSL and reverse proxies to Miniserve.
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt
    networks:
      - file-network

  # DDNS Client for DuckDNS
  # keeps your dynamic IP address updated with DuckDNS Domain
  # using DuckDNS because you get 5 free domains and easy to set up
  # (left on :latest on purpose - linuxserver.io only publishes hash-based tags)
  # s6-based image like npm: starts as root, drops to PUID/PGID itself.
  ddns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: ddns
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - SUBDOMAINS=${DUCKDNS_SUBDOMAINS}
      - TOKEN=${DUCKDNS_TOKEN}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}

networks:
  minecraft-network:
    external: false
  file-network:
    external: false
